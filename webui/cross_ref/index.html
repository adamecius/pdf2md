<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>pdf2md — semantic + docling viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <strong>pdf2md viewer</strong>

    <label>Example
      <select id="picker-example"></select>
    </label>

    <label>Semantic backend
      <select id="picker-semantic"></select>
    </label>

    <label>OCR candidates
      <select id="picker-ocr">
        <option value="">none (markers only)</option>
      </select>
    </label>

    <span id="doc-class" class="doc-class" title="Document-class classification (Plan 7)"></span>
    <span id="status" class="status">Loading…</span>
  </header>

  <main>
    <section id="pane-graph">
      <h2>Cross-reference graph</h2>
      <svg id="chart"></svg>
      <p class="legend">
        <span class="legend-key resolved">resolved x-ref</span>
        <span class="legend-key unresolved">unresolved x-ref</span>
        <span class="legend-key contains">contains (hierarchy)</span>
        <span class="legend-key sequence">page sequence</span>
      </p>
    </section>

    <section id="pane-side">
      <div class="tabs">
        <button class="tab active" data-tab="stats">Stats</button>
        <button class="tab" data-tab="structure">Docling structure</button>
        <button class="tab" data-tab="markers">Markers</button>
        <button class="tab" data-tab="adjudicate">Adjudicate</button>
      </div>
      <div id="tab-stats" class="tab-pane active"></div>
      <div id="tab-structure" class="tab-pane"></div>
      <div id="tab-markers" class="tab-pane"></div>
      <div id="tab-adjudicate" class="tab-pane"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="viewer.js"></script>
</body>
</html>
