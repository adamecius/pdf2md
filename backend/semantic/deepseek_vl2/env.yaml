name: pdf2md-deepseek-vl2
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pytorch=2.4.*
  - pytorch-cuda=12.1
  - torchvision=0.19.*
  - pillow>=10.0
  - pip:
      - transformers>=4.45,<5
      - accelerate>=0.34
      - sentencepiece>=0.2
      - einops>=0.8

# !!! KNOWN ISSUE — verified 2026-05-24 !!!
#
# This env on its own does NOT support `deepseek-ai/deepseek-vl2-small`.
# Stock `transformers` (any version from 4.45 to 4.57) does not recognise
# the `deepseek_vl_v2` architecture even with `trust_remote_code=True`,
# and the model load fails at smoke-test time with:
#
#   env_not_ready: model load failed: The checkpoint you are trying to
#   load has model type `deepseek_vl_v2` but Transformers does not
#   recognize this architecture.
#
# Loading the official `deepseek-vl2` python package from
# `git+https://github.com/deepseek-ai/DeepSeek-VL2.git` registers the
# architecture but in turn requires `torch==2.0.1` + `transformers==4.38.2`
# + `timm`, `xformers`, `attrdict` — these conflict with the CUDA 12.x
# torch this env ships and with the conda torchvision 0.19 binary
# (which then errors out with `operator torchvision::nms does not exist`
# under any torch ≥ 2.10).
#
# Follow-up: see plans/005_1-deepseek-vl2-rework.md for the planned
# redesign (either pin deepseek-vl2's exact dep set in an isolated env
# or migrate to a stock-transformers-supported VLM like Qwen2-VL).
#
# Model download (when the env is fixed):
#   from transformers import AutoModelForCausalLM, AutoProcessor
#   AutoModelForCausalLM.from_pretrained("deepseek-ai/deepseek-vl2-small")
#
# The "small" variant is ~5.6 GB and fits a single 16 GB GPU.

# Plan 005 only requires loading + one image → JSON. Larger variants
# (deepseek-vl2-tiny / deepseek-vl2) are not pinned here.
