[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2md"
version = "0.1.0"
description = "PDF to Markdown converter skeleton"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "mypy>=1.10",
  "pytest>=8",
]

[project.scripts]
pdf2md = "pdf2md.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf2md = ["data/factory_priors/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "legacy: tests for superseded modules (will be removed)",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (typer pattern)
    "UP042",  # str-Enum to StrEnum: behavioural-equivalent rewrite would touch
              # every model enum and risk JSON-serialisation drift against
              # snapshot fixtures. Plan 3 forbids runtime behaviour changes.
]

[tool.ruff.lint.isort]
known-first-party = ["pdf2md"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "src/pdf2md/_legacy/",
    "tests/_legacy_temp/",
]
