name: Deploy validator to GitHub Pages

# Builds webui/validator as a static SPA, stages the read-only repo
# artefacts (groundtruth corpus + factory priors) into validator/public/api/,
# and publishes the resulting dist/ to GitHub Pages.
#
# The validator is purely client-side — there is no server component. The
# `stage-data` script copies the JSONs the SPA fetches at runtime and
# generates `_index.json` manifests so the static host can answer
# directory-listing requests.

on:
  push:
    branches: [main]
    paths:
      - "webui/**"
      - "groundtruth/corpus/latex/**"
      - "src/pdf2md/data/factory_priors/**"
      - ".github/workflows/deploy-validator.yml"
  workflow_dispatch:

# A single concurrent deploy at a time — newer runs cancel older ones.
concurrency:
  group: pages-validator
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webui/package-lock.json

      # Compile the LaTeX corpus to PDFs so the validator's PDF panel
      # has something to render in the static deploy. The .tex sources
      # are in git; the .pdf outputs are .gitignored. We use lualatex
      # only (no latexml) since the validator doesn't consume the XML.
      - name: Install TeX Live (lualatex only)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-science \
            lmodern

      - name: Compile corpus PDFs (lualatex)
        env:
          CORPUS_ROOT: groundtruth/corpus/latex
        run: |
          set -eu
          shopt -s nullglob
          ok=0
          fail=0
          for tex in "${CORPUS_ROOT}"/*/*.tex; do
            doc_dir=$(dirname "$tex")
            base=$(basename "$tex" .tex)
            if lualatex --interaction=nonstopmode --halt-on-error \
                 --output-directory "$doc_dir" "$tex" \
                 > "$doc_dir/build.log" 2>&1; then
              # lualatex may need a second pass for references/labels
              lualatex --interaction=nonstopmode --halt-on-error \
                   --output-directory "$doc_dir" "$tex" \
                   >> "$doc_dir/build.log" 2>&1 || true
              ok=$((ok+1))
            else
              echo "::warning::lualatex failed for $tex (see $doc_dir/build.log)"
              fail=$((fail+1))
            fi
          done
          echo "Compiled $ok PDFs; $fail failed."

      - name: Install workspace deps
        working-directory: webui
        run: npm ci || npm install

      - name: Build for GitHub Pages
        working-directory: webui
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        # `build:pages` stages the repo artefacts (including the freshly
        # compiled PDFs from the step above) into validator/public/api/
        # and runs `vite build` with the correct base path.
        run: npm run build:pages

      - name: Upload dist artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webui/validator/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
